# --- SERVER ---
# Render \u0432\u0438\u0434\u0430\u0454 \u0434\u0438\u043D\u0430\u043C\u0456\u0447\u043D\u0438\u0439 \u043F\u043E\u0440\u0442, \u0442\u043E\u043C\u0443 \u0447\u0438\u0442\u0430\u0454\u043C\u043E \u0437\u043C\u0456\u043D\u043D\u0443 PORT, \u0430\u0431\u043E 8080 \u0437\u0430 \u0437\u0430\u043C\u043E\u0432\u0447\u0443\u0432\u0430\u043D\u043D\u044F\u043C
server.port=${PORT:8080}

# --- DATABASE CONFIGURATION ---
# \u042F\u043A\u0449\u043E \u0454 \u0437\u043C\u0456\u043D\u043D\u0430 SPRING_DATASOURCE_URL (\u0443 \u0445\u043C\u0430\u0440\u0456) - \u0431\u0435\u0440\u0435\u043C\u043E \u0457\u0457.
# \u042F\u043A\u0449\u043E \u043D\u0435\u043C\u0430\u0454 (\u043B\u043E\u043A\u0430\u043B\u044C\u043D\u043E) - \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454\u043C\u043E H2.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/catalog;AUTO_SERVER=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# --- JPA / HIBERNATE ---
# \u0423 \u0445\u043C\u0430\u0440\u0456 \u043A\u0440\u0430\u0449\u0435 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0432\u0430\u0442\u0438 'validate' \u0430\u0431\u043E 'update', \u0449\u043E\u0431 \u043D\u0435 \u0432\u0442\u0440\u0430\u0442\u0438\u0442\u0438 \u0434\u0430\u043D\u0456
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# --- INITIALIZATION (schema.sql / data.sql) ---
# \u0417\u0430\u0432\u0436\u0434\u0438 \u0432\u0438\u043A\u043E\u043D\u0443\u0454\u043C\u043E \u0441\u043A\u0440\u0438\u043F\u0442\u0438 (Spring Boot \u0441\u0430\u043C \u0440\u043E\u0437\u0431\u0435\u0440\u0435\u0442\u044C\u0441\u044F)
spring.sql.init.mode=always

# --- GMAIL SMTP ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# \u0426\u0456 \u0434\u0430\u043D\u0456 \u043C\u0438 \u0442\u0435\u0436 \u0431\u0443\u0434\u0435\u043C\u043E \u0437\u0430\u0434\u0430\u0432\u0430\u0442\u0438 \u0432 Render \u0447\u0435\u0440\u0435\u0437 \u0437\u043C\u0456\u043D\u043D\u0456
spring.mail.username=${SPRING_MAIL_USERNAME:TVIY_EMAIL@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:TVIY_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# --- FREEMARKER ---
spring.freemarker.template-loader-path=classpath:/mail-templates/
spring.freemarker.suffix=.ftl
spring.freemarker.contentType=text/html
spring.freemarker.charset=UTF-8