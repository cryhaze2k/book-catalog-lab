# === \u041D\u0410\u041B\u0410\u0428\u0422\u0423\u0412\u0410\u041D\u041D\u042F \u0421\u0415\u0420\u0412\u0415\u0420\u0410 ===
# \u041F\u043E\u0440\u0442, \u043D\u0430 \u044F\u043A\u043E\u043C\u0443 \u0437\u0430\u043F\u0443\u0441\u043A\u0430\u0454\u0442\u044C\u0441\u044F \u0441\u0430\u0439\u0442
server.port=8090

# --- GMAIL SMTP CONFIGURATION ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TVIY_EMAIL@gmail.com
spring.mail.password=TVIY_APP_PASSWORD_16_CHARS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# --- FREEMARKER CONFIGURATION ---
# \u0412\u043A\u0430\u0437\u0443\u0454\u043C\u043E, \u0449\u043E \u0448\u0430\u0431\u043B\u043E\u043D\u0438 \u043B\u0438\u0441\u0442\u0456\u0432 \u0431\u0443\u0434\u0435\u043C\u043E \u0448\u0443\u043A\u0430\u0442\u0438 \u043D\u0435 \u0442\u0430\u043C \u0434\u0435 HTML \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u0438
spring.freemarker.template-loader-path=classpath:/mail-templates/
spring.freemarker.charset=UTF-8
spring.freemarker.check-template-location=false
spring.freemarker.suffix=.ftl

# === \u041D\u0410\u041B\u0410\u0428\u0422\u0423\u0412\u0410\u041D\u041D\u042F \u041A\u041E\u0414\u0423\u0412\u0410\u041D\u041D\u042F (FIX ????) ===
# 1. \u041F\u0440\u0438\u043C\u0443\u0441\u043E\u0432\u0435 \u043A\u043E\u0434\u0443\u0432\u0430\u043D\u043D\u044F \u0434\u043B\u044F HTTP \u0437\u0430\u043F\u0438\u0442\u0456\u0432 \u0442\u0430 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u0435\u0439
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# 2. \u041A\u043E\u0434\u0443\u0432\u0430\u043D\u043D\u044F \u0434\u043B\u044F \u0444\u0430\u0439\u043B\u0456\u0432 \u043F\u0435\u0440\u0435\u043A\u043B\u0430\u0434\u0443 (messages.properties)
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# 3. \u041A\u043E\u0434\u0443\u0432\u0430\u043D\u043D\u044F \u0434\u043B\u044F HTML \u0448\u0430\u0431\u043B\u043E\u043D\u0456\u0432 (\u0426\u0415 \u0412\u0410\u0416\u041B\u0418\u0412\u041E \u0414\u041B\u042F THYMELEAF)
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# === \u041D\u0410\u041B\u0410\u0428\u0422\u0423\u0412\u0410\u041D\u041D\u042F \u0417\u0410\u0421\u0422\u041E\u0421\u0423\u041D\u041A\u0423 ===
spring.application.name=book-catalog

# === \u0411\u0410\u0417\u0410 \u0414\u0410\u041D\u0418\u0425 H2 ===
# \u0428\u043B\u044F\u0445 \u0434\u043E \u0444\u0430\u0439\u043B\u0443 \u0431\u0430\u0437\u0438 \u0434\u0430\u043D\u0438\u0445
spring.datasource.url=jdbc:h2:file:./data/catalog;AUTO_SERVER=TRUE
# \u041B\u043E\u0433\u0456\u043D \u0442\u0430 \u043F\u0430\u0440\u043E\u043B\u044C
spring.datasource.username=sa
spring.datasource.password=
# \u0414\u0440\u0430\u0439\u0432\u0435\u0440
spring.datasource.driver-class-name=org.h2.Driver

# \u041A\u043E\u043D\u0441\u043E\u043B\u044C H2 (\u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0430 \u0437\u0430 \u0430\u0434\u0440\u0435\u0441\u043E\u044E /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# \u0417\u0430\u0432\u0436\u0434\u0438 \u0437\u0430\u043F\u0443\u0441\u043A\u0430\u0442\u0438 \u0441\u043A\u0440\u0438\u043F\u0442\u0438 schema.sql \u0442\u0430 data.sql
spring.sql.init.mode=always